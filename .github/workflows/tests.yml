name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      APP_ENV: test
      MONGO_URI: mongodb://127.0.0.1:27017/placement_mentor_ci
      JWT_SECRET: ci-test-only-signing-key-not-a-production-secret
      GROQ_API_KEY: ""
      RESEND_API_KEY: ""
      BREVO_API_KEY: ""
      SMTP_HOST: ""
      PISTON_EXECUTE_URL: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Secret-pattern scan (all tracked files)
        run: python scripts/check_secrets.py
      - name: Install Python dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Python tests (pytest and unittest)
        run: python -m pytest tests
      - name: Frontend behavior smoke tests
        if: ${{ !cancelled() }}
        run: node --test tests/frontend-smoke.test.js
      - name: JavaScript syntax checks
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find frontend/js -type f -name '*.js' -print0)
          node --check tests/frontend-smoke.test.js
          node --check scripts/workspace_smoke.cjs
          node --check scripts/resume_smoke.cjs
          node --check scripts/spoken_smoke.cjs
