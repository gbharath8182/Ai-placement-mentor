<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics | AI Placement Mentor</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/app.css">
    <script src="/static/js/app-shell.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.8/dist/chart.umd.min.js"></script>
    <script>(function(){try{if(localStorage.getItem('theme')==='light')document.documentElement.classList.add('light-theme');}catch{}})();</script>
</head>
<body>
    <nav class="app-fallback-nav" aria-label="Primary">
        <a href="/dashboard">AI Placement Mentor</a>
        <a href="/learn">Curriculum</a>
        <a href="/profile">Profile</a>
    </nav>
    <main class="dashboard-container">
        <header class="dashboard-hero"><h1 class="dashboard-title">Learning analytics</h1><p class="dashboard-subtitle">A clear view of your study time, consistency and learning progress.</p></header>
        <section class="analytics-cards" id="analytics-cards"></section>
        <section class="analytics-grid">
            <div class="glass-panel profile-panel"><h2>Time by Domain</h2><canvas id="domain-time-chart" height="240"></canvas></div>
            <div class="glass-panel profile-panel"><h2>Problems Solved</h2><canvas id="solved-chart" height="240"></canvas></div>
            <div class="glass-panel profile-panel analytics-wide"><h2>Skill Coverage</h2><canvas id="coverage-chart" height="180"></canvas></div>
        </section>
    </main>
    <script src="/static/js/theme.js"></script>
    <script src="/static/js/auth.js"></script>
    <script src="/static/js/analytics.js"></script>
</body>
</html>
