<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aptitude Section | AI Placement Mentor</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/app.css">
    <script src="/static/js/app-shell.js" defer></script>
    <script>
(function(){try{if(localStorage.getItem('theme')==='light')document.documentElement.classList.add('light-theme');}catch{}})();
</script>
</head>
<body>
    <!-- Navbar -->
    <nav class="app-fallback-nav" aria-label="Primary">
        <a href="/dashboard">AI Placement Mentor</a>
        <a href="/learn">Curriculum</a>
        <a href="/profile">Profile</a>
    </nav>
    
    <!-- Workspace -->
    <main class="aptitude-container">
        <header class="dashboard-hero" style="margin-bottom: 30px;">
            <h1 class="dashboard-title"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--accent-secondary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-right: 8px; filter: drop-shadow(0 0 8px rgba(188, 140, 255, 0.35));"><path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"/><path d="M12 6v6l4 2"/></svg>Aptitude Question Bank</h1>
            <p class="dashboard-subtitle">Sharpen reasoning, mathematics, and computer-science fundamentals with original company-style practice sets, clear explanations, and no paywall.</p>
        </header>
        
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; flex-wrap: wrap; gap: 15px;">
            <div class="user-badge" style="background: rgba(88, 166, 255, 0.08); border-color: rgba(88, 166, 255, 0.2);">
                <span>Score: <strong id="score-counter" style="color: var(--accent-primary);">0 / 0</strong></span>
            </div>
            <div style="display: flex; gap: 10px; align-items: center;">
                <label for="company-filter" class="form-label" style="margin-bottom: 0; white-space: nowrap;">Company:</label>
                <select id="company-filter" class="form-select" style="padding: 6px 28px 6px 10px; font-size: 0.85rem; width: 150px; background-position: right 8px center; border-radius: 8px; margin-right: 10px;">
                    <option value="all">All Companies</option>
                    <option value="TCS">TCS</option>
                    <option value="Infosys">Infosys</option>
                    <option value="Microsoft">Microsoft</option>
                    <option value="Wipro">Wipro</option>
                    <option value="General">General</option>
                </select>
                <button class="btn-chip" id="reset-quiz-btn" style="border-radius: 8px; padding: 8px 16px;">Reset Quiz</button>
            </div>
        </div>
        
        <!-- Questions Area -->
        <div id="questions-wrapper">
            <!-- Dynamically populated from JS -->
            <div style="color: var(--text-muted); text-align: center; padding: 40px;">
                Loading assessment queries...
            </div>
        </div>
    </main>
    
    <script src="/static/js/auth.js"></script>
    <script src="/static/js/activity.js"></script>
    <script src="/static/js/theme.js"></script>
    <script src="/static/js/aptitude.js"></script>
</body>
</html>
